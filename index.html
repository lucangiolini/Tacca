<!doctype html>
<html lang="it" data-tema="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tacca</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tacca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
:root{
  --acc:#D2461F;--acc-t:var(--acc);
  --bg:#F2F2F7;--ink:#1D1D1F;--mut:#66666C;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.78);--glass3:rgba(255,255,255,.86);--gb:rgba(255,255,255,.7);--line:rgba(60,60,67,.16);
  --sh:0 8px 32px rgba(40,40,90,.10);
  --ok:#1E6B3A;--okbg:#E3F1E8;--warn:#8A5F00;--warnbg:#FBF0D6;--onwarn:#fff;
  --tint:color-mix(in srgb,var(--acc) 24%,#fff);--shp:var(--acc);
  --serif:ui-serif,'New York','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:-apple-system,'SF Pro Text','Helvetica Neue',system-ui,'Segoe UI',Roboto,sans-serif;
  --blob:.34;color-scheme:light;
}
:root[data-tema="scuro"]{
  --acc-t:color-mix(in srgb,var(--acc) 50%,#fff);--shp:var(--acc-t);
  --bg:#0A0A10;--ink:#F5F5F7;--mut:#A6A6B0;
  --glass:rgba(34,34,48,.5);--glass2:rgba(60,60,80,.55);--glass3:rgba(26,26,38,.88);--gb:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --sh:0 8px 32px rgba(0,0,0,.4);
  --ok:#74D69E;--okbg:rgba(116,214,158,.16);--warn:#F0C265;--warnbg:rgba(240,194,101,.16);--onwarn:#1D1D1F;
  --tint:color-mix(in srgb,var(--acc) 38%,#14141c);--blob:.42;color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-tema="auto"]{
    --acc-t:color-mix(in srgb,var(--acc) 50%,#fff);--shp:var(--acc-t);
    --bg:#0A0A10;--ink:#F5F5F7;--mut:#A6A6B0;
    --glass:rgba(34,34,48,.5);--glass2:rgba(60,60,80,.55);--glass3:rgba(26,26,38,.88);--gb:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
    --sh:0 8px 32px rgba(0,0,0,.4);
    --ok:#74D69E;--okbg:rgba(116,214,158,.16);--warn:#F0C265;--warnbg:rgba(240,194,101,.16);--onwarn:#1D1D1F;
    --tint:color-mix(in srgb,var(--acc) 38%,#14141c);--blob:.42;color-scheme:dark;
  }
}
html{background:var(--bg)}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--acc-t);outline-offset:3px}
.serif{font-family:var(--serif);font-weight:500}

/* sfondo con trasparenze */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(72px);opacity:var(--blob);will-change:transform}
#bg .b1{width:380px;height:380px;left:-130px;top:-110px;background:var(--acc);animation:d1 38s ease-in-out infinite alternate}
#bg .b2{width:340px;height:340px;right:-140px;top:34%;background:#E3A93B;animation:d2 46s ease-in-out infinite alternate}
#bg .b3{width:320px;height:320px;left:-60px;bottom:-110px;background:#2F7F78;animation:d3 42s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,120px)}}
@keyframes d2{to{transform:translate(-110px,-90px)}}
@keyframes d3{to{transform:translate(120px,-70px)}}
.mgrid{position:absolute;top:-70px;right:-70px;width:204px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;opacity:.7}
.mgrid b{height:60px;border-radius:16px;background:color-mix(in srgb,var(--acc) 17%,transparent)}
.mgrid b:nth-child(even){background:color-mix(in srgb,var(--acc) 28%,transparent)}
.mgrid b:last-child{background:none;border:2px dashed var(--acc-t)}

/* vetro */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:24px}
.card{padding:20px;display:flex;flex-direction:column;gap:12px}

/* schermate */
.scr{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 30px) 20px calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.scr.ses,.scr.mid{padding-bottom:36px}
.scr.ses{gap:16px;padding-top:calc(env(safe-area-inset-top) + 18px)}
.scr.mid{min-height:100dvh;justify-content:center}
.enter{animation:enter .38s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.hd .sm{margin-bottom:2px}
.h1{font-size:40px;letter-spacing:-.01em;line-height:1.1}
.big{font-size:50px;font-weight:400;letter-spacing:-.02em;line-height:1.05}
.big2{font-size:38px;letter-spacing:-.015em;line-height:1.1}
.h3{font-size:22px;line-height:1.15}.h4{font-size:20px;line-height:1.2}
.q{font-size:26px;line-height:1.15;letter-spacing:-.01em}
.mut{color:var(--mut)}.sm{font-size:13px}.sm2{font-size:14px;color:var(--mut)}
.t17{font-size:17px;font-weight:600}.t15{font-size:15px;font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px}
.note{padding:0 4px}

/* home */
.ens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.en{height:80px;border-radius:20px;border:1px solid var(--gb);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:var(--sh);transition:transform .15s,background .2s}
.en b{font-size:15px;font-weight:600}.en small{font-size:12px;color:var(--mut)}
.en:active{transform:scale(.97)}
.en.on{background:var(--acc);color:#fff;border-color:transparent}
.en.on small{color:rgba(255,255,255,.85)}
.stps{display:flex}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.stl{width:100%;display:flex;align-items:center}
.stl i{flex:1;height:2px;background:var(--line)}.stl i.blank{background:transparent}
.stl b{width:30px;height:30px;border-radius:15px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.stl b.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stn{font-size:15px;font-weight:600;text-align:center}
.stm{font-size:13px;color:var(--mut);margin-top:-6px}
.today{display:flex;align-items:center;gap:10px;padding-left:4px;font-size:14px}
.scr.home{min-height:100vh;min-height:100dvh;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.cta{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.lnk{background:none;border:0;padding:8px;font-size:14px;color:var(--acc-t);text-decoration:underline;text-underline-offset:3px;text-align:center}
.slide{--p:0;position:relative;height:68px;border-radius:34px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);border:1px solid var(--gb);box-shadow:var(--sh);touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(66px + var(--p)*(100% - 66px));background:color-mix(in srgb,var(--acc) 22%,transparent);border-radius:34px}
.slt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:44px;font-size:17px;font-weight:500;opacity:calc(1 - var(--p)*1.5);pointer-events:none}
.shim{background:linear-gradient(100deg,var(--mut) 34%,var(--ink) 50%,var(--mut) 66%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shim 2.8s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.thumb{position:absolute;left:6px;top:6px;width:54px;height:54px;border-radius:27px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 45%,transparent);touch-action:none;cursor:grab;transition:transform .42s cubic-bezier(.2,.9,.3,1.15)}
.slide.drag .thumb{transition:none;cursor:grabbing}
.chv{position:absolute;right:22px;top:26px;color:var(--mut);opacity:calc(1 - var(--p)*2)}

/* dock */
.dock{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 40px),440px);height:68px;padding:6px;border-radius:34px;display:flex;gap:4px;align-items:center;background:var(--glass3);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gb);box-shadow:0 10px 34px rgba(0,0,0,.14);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.dock.hide{transform:translate(-50%,160%)}
.dk{flex:1;height:54px;border:0;border-radius:27px;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:0;transition:flex .4s cubic-bezier(.3,.9,.3,1),background .25s,color .25s;overflow:hidden}
.dk span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:15px;font-weight:600;transition:max-width .4s,opacity .3s,margin .4s}
.dk.on{flex:2.4;background:color-mix(in srgb,var(--acc) 17%,transparent);color:var(--acc-t)}
.dk.on span{max-width:96px;opacity:1;margin-left:8px}

/* allena */
.area{flex-direction:row;align-items:center;gap:14px;padding:16px}
.mini{width:52px;height:52px;flex:none}.mini svg{width:100%;height:100%}.mi{fill:var(--acc-t)}
.ainfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:color-mix(in srgb,var(--acc) 17%,transparent);color:var(--acc-t)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.bar.thick{height:9px;border-radius:5px}
.btn{height:56px;border:0;border-radius:16px;font-size:17px;font-weight:600;transition:transform .15s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.pri{background:var(--acc);color:#fff}
.btn.sec{background:var(--glass2);border:1px solid var(--gb)}
.btn.dng{background:var(--warn);color:var(--onwarn)}
.btn:disabled{opacity:.42}
.btn.go{height:44px;padding:0 16px;font-size:15px;flex:none}

/* progressi */
.segs{display:flex;gap:2px;padding:3px;border-radius:14px}
.sg{flex:1;min-height:36px;padding:4px 6px;border:0;border-radius:11px;background:transparent;font-size:13.5px;line-height:1.15}
.sg.on{background:var(--glass3);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.bigrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{font-size:54px;letter-spacing:-.02em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:14px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.ax{display:flex;justify-content:space-between;font-size:12px}
.vuoto{padding:22px 4px;font-size:15px;line-height:1.4}
.rws{display:flex;flex-direction:column;gap:2px}
.rw{display:flex;align-items:center;gap:12px;min-height:42px}
.rn{width:84px;font-size:15px;flex:none}
.rw .bar{flex:1}
.rv{min-width:74px;text-align:right;font-size:15px;display:flex;align-items:center;justify-content:flex-end;gap:3px}
.rv small{font-size:12px}
.rv.okc{color:var(--ok)}.rv.warnc{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:14px 8px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.tile b{font-size:30px;font-weight:500;line-height:1.1}
.tiles.in .tile{background:var(--glass2);border-radius:18px}

/* obiettivi */
.strow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.card .strow+.strow{border-top:1px solid var(--line)}
.stp2{display:flex;align-items:center;gap:6px}
.rb{width:44px;height:44px;border-radius:22px;border:0;background:var(--line);display:flex;align-items:center;justify-content:center}
.rb:active{transform:scale(.94)}
.sv{min-width:38px;text-align:center;font-size:24px}
.week{display:flex;justify-content:space-between;margin:6px 0 2px}
.dy{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.dy i{width:36px;height:36px;border-radius:18px;background:var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.dy i.f{background:var(--acc)}.dy i.t{background:transparent;border:2px solid var(--acc)}.dy i.u{opacity:.55}
.dy .b{font-weight:700}
.chal{background:var(--glass2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.tag2{font-size:13px;font-weight:600;color:var(--warn)}
.lbl{font-size:13px;color:var(--mut);margin:12px 0 2px}
.sw2{position:relative;width:51px;height:31px;border:0;padding:0;border-radius:16px;background:var(--line);flex:none;transition:background .25s}
.sw2 i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .25s cubic-bezier(.3,.9,.3,1)}
.sw2.on{background:var(--acc)}.sw2.on i{left:22px}
.sws{display:flex;gap:14px;padding:6px 2px}
.sw{width:40px;height:40px;border-radius:20px;border:0}
.sw.on{outline:3px solid var(--ink);outline-offset:3px}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:52px;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:0}
.row:first-of-type{border-top:0}
.row span{display:flex;align-items:center;gap:12px}
.row.danger{color:var(--warn)}

/* sessione */
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px 6px 6px;border-radius:28px;min-height:60px}
.ib{width:48px;height:48px;border-radius:24px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.sm2c{flex:1;display:flex;flex-direction:column;min-width:0}.sm2c b{font-size:16px}
.tn{font-family:var(--serif);font-size:36px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:80px;text-align:right}
.tbar{height:18px;border-radius:9px;background:var(--glass);border:1px solid var(--gb);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tbar.thin{height:7px;border-radius:4px}
.tfill{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));box-shadow:0 0 16px color-mix(in srgb,var(--acc) 60%,transparent);transition:width .25s linear}
.tbar.low .tfill{background:linear-gradient(90deg,#C98A1B,#E8B64D);box-shadow:0 0 16px rgba(232,182,77,.6)}
.tbar.end .tfill{width:0!important}
.tlab{min-height:18px;margin-top:-10px}
.mgr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(100%,340px);margin:0 auto}
.mc{aspect-ratio:1;background:var(--glass2);border:1px solid var(--gb);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:6px}
.mc svg{width:100%;height:100%}
.mc.q{background:none;border:2px dashed var(--acc-t);font-family:var(--serif);font-size:44px;color:var(--acc-t)}
.sq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sq span{min-width:54px;height:58px;padding:0 14px;border-radius:16px;background:var(--glass2);border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:28px}
.sq .qm,.an .qm{border:2px dashed var(--acc-t);background:none;color:var(--acc-t)}
.tg{width:150px;aspect-ratio:1;margin:0 auto;padding:10px;background:var(--glass2);border:1px solid var(--gb);border-radius:22px}
.tg svg{width:100%;height:100%}
.an{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--serif);font-size:30px;text-align:center}
.an b{font-weight:500}.an i{font-style:normal;color:var(--mut)}.an .eq{color:var(--mut);font-size:24px}
.an .qm{display:inline-block;min-width:44px;border-radius:12px;padding:0 8px}
.opts{display:grid;gap:10px}
.opts.o4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.o2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;border-radius:18px;border:2px solid transparent;background:var(--glass2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,border-color .2s}
.o4 .opt{aspect-ratio:1;padding:6px}
.o4 .opt svg{width:100%;height:100%}
.o2 .opt{min-height:64px;padding:10px 12px;font-size:19px;font-weight:600;line-height:1.15}
.opts.onum .opt span{font-family:var(--serif);font-size:30px;font-weight:500}
.opt:active:not(:disabled){transform:scale(.97)}
.opt.sel{border-color:var(--acc-t);background:color-mix(in srgb,var(--acc) 14%,var(--glass2))}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--warn);background:var(--warnbg)}
.opt:disabled{color:inherit}
.mk{position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
.opt.right .mk{background:var(--ok);color:var(--bg)}.opt.wrong .mk{background:var(--warn);color:var(--onwarn)}
.gf{fill:var(--shp)}.ge{fill:var(--line)}
.ngr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(100%,320px);margin:0 auto}
.ngr span{height:72px;border-radius:18px;background:var(--glass2);border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px}
.ngr .qm{background:none;border:2px dashed var(--acc-t);color:var(--acc-t)}
.lg{padding:18px 20px;display:flex;flex-direction:column;gap:8px;border-radius:22px}
.lg p{font-size:17px;line-height:1.4}
.lg .lq{font-weight:700;margin-top:4px}
.cod{display:flex;flex-direction:column;gap:10px;align-items:center}
.cod div{display:flex;align-items:center;gap:12px}
.cod span{padding:10px 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--gb);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:22px;letter-spacing:.14em}
.cod i{font-style:normal;color:var(--mut);font-size:22px}
.cod .qm{border:2px dashed var(--acc-t);background:none;color:var(--acc-t);min-width:60px;text-align:center}
.ocod .opt span{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;font-size:18px}
.prv{font-size:26px;line-height:1.25;text-align:center;padding:10px 6px}
.opts.o1{grid-template-columns:1fr}
.o1 .opt{justify-content:flex-start;text-align:left;min-height:56px;padding:12px 16px;font-size:16px;font-weight:500;line-height:1.3}
.fb{position:relative;height:14px;border-radius:7px;background:var(--line);margin:4px 0}
.fb i{position:absolute;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));box-shadow:0 0 12px color-mix(in srgb,var(--acc) 50%,transparent)}
.fb b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.intro{padding:28px 24px;gap:14px}

function save() {
  S.updatedAt = Date.now();
  if (S.history.length > 1500) S.history = S.history.slice(-1500);
  if (S.dita.length > 400) S.dita = S.dita.slice(-400);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
  if (dbRef) { clearTimeout(dbTimer); dbTimer = setTimeout(() => { dbRef.set(JSON.parse(JSON.stringify(S))).then(() => setSync('Sincronizzato con il tuo account')).catch(() => setSync('Salvato solo su questo dispositivo')); }, 1200); }
}
let syncTxt = 'Salvato su questo dispositivo';
function setSync(t) { syncTxt = t; const el = $('#syncTxt'); if (el) el.textContent = t; }
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!d || !u) return;
    const uid = await u.id(); if (!uid) return;
    dbRef = d.doc('data/users/' + uid + '/hangboard');
    const snap = await dbRef.get();
    if (snap.exists) {
      const o = snap.data();
      if ((o.updatedAt || 0) > (S.updatedAt || 0)) { S = mergeState(o); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { } if (!sess) render(); }
      else if (S.updatedAt) dbRef.set(JSON.parse(JSON.stringify(S))).catch(() => { });
    } else if (S.updatedAt) dbRef.set(JSON.parse(JSON.stringify(S))).catch(() => { });
    setSync('Sincronizzato con il tuo account');
  } catch (e) { dbRef = null; }
}

const allProtocols = () => [...STD.filter(p => !p.hidden), ...S.custom];
const getP = id => S.custom.find(p => p.id === id) || STD.find(p => p.id === id);
const isStd = id => String(id).startsWith('s-');
const catOf = p => CATS[p.cat] || CATS.custom;
/* applica l'ultima progressione accettata */
function conProgressione(p) {
  const g = S.prog[p.id]; if (!g) return { ...p };
  const q = { ...p };
  if (g.load != null) q.load = g.load;
  if (g.reps != null) q.reps = g.reps;
  if (g.mm != null) q.mm = g.mm;
  return q;
}
function durata(p) {
  const perRep = p.hang * (p.oneArm ? 2 : 1) + (p.oneArm ? p.rest : 0);
  const serie = p.reps * perRep + Math.max(0, p.reps - 1) * p.rest;
  return S.settings.prep + p.sets * serie + Math.max(0, p.sets - 1) * p.setRest;
}

function pillola() {
  if (!S.settings.pillole) return null;
  let liberi = PILLOLE.map((_, i) => i).filter(i => !S.pv.includes(i));
  if (!liberi.length) { S.pv = []; liberi = PILLOLE.map((_, i) => i); }
  const i = pick(liberi); S.pv.push(i); while (S.pv.length > Math.floor(PILLOLE.length * 0.8)) S.pv.shift();
  return PILLOLE[i];
}

/* ====== Adattamento della sessione di oggi ====== */
const EN_TXT = { bassa: 'Bassa', media: 'Media', alta: 'Alta' };
const DITA_TXT = ['Niente', 'Lieve', 'Presente', 'Forte'];
const DITA_LAB = DITA_TXT.map((t, i) => `<b class="n">${i}</b><small>${t}</small>`);
const IERI_TXT = { no: 'No', poco: 'Poco', tanto: 'Tanto' };
const r5 = x => Math.max(5, Math.round(x / 5) * 5);

function caricoTotale(p) { return S.settings.bw + (+p.load || 0); }
function conTotale(p, tot) { p.load = r05(tot - S.settings.bw); return p; }

/* ctx: {energia, dita, ieri, pause?, tempo?, ditaCheck?} → protocollo adattato e note leggibili */
function adatta(base, ctx) {
  const p = { ...base }, note = [];
  const dita = Math.max(ctx.dita || 0, ctx.ditaCheck ?? 0);
  const scarico = ctx.energia === 'bassa' || ctx.ieri === 'tanto';
  if (p.cat !== 'riscaldamento') {
    if (scarico) {
      if (p.sets > 1) p.sets -= 1;
      conTotale(p, caricoTotale(p) * 0.9);
      note.push(ctx.energia === 'bassa' ? 'Energia bassa: una serie in meno e carico −10%.' : 'Ieri hai arrampicato tanto: una serie in meno e carico −10%.');
    }
    if (dita === 2) {
      conTotale(p, caricoTotale(p) * 0.8);
      if (p.mm < 20) { p.mm = 20; }
      if (ARCUATE.includes(p.grip)) p.grip = 'Aperta 4 dita';
      note.push('Dita a 2: carico −20%, tacca di almeno 20 mm e presa aperta.');
    } else if (dita >= 3) {
      conTotale(p, caricoTotale(p) * 0.6);
      p.mm = Math.max(p.mm, 25); p.grip = 'Aperta 4 dita'; p.sets = Math.min(p.sets, 2);
      note.push('Dita a 3: versione molto leggera, tacca ampia, presa aperta e al massimo 2 serie. Oggi sarebbe meglio riposare.');
    } else if (dita === 1) note.push('Dita a 1: niente aumenti di carico oggi.');
  }
  if (ctx.pause === 'corte' || ctx.pause === 'lunghe') {
    const f = ctx.pause === 'corte' ? 1.2 : 0.8;
    if (p.rest >= 10) p.rest = Math.round(p.rest * f);
    p.setRest = Math.max(30, r5(p.setRest * f));
    note.push(ctx.pause === 'corte' ? 'Pause un po’ più lunghe (+20%).' : 'Pause un po’ più corte (−20%).');
  }
  if (ctx.tempo && ctx.tempo !== 'tutto') {
    const lim = ctx.tempo * 60 - (ctx.giaFatti || 0);
    let tolte = 0;
    while (p.sets > 1 && durata(p) > lim) { p.sets--; tolte++; }
    if (tolte) note.push(`Con il tempo che hai: ${tolte === 1 ? 'una serie' : tolte + ' serie'} in meno.`);
  }
  if (ctx.energia === 'alta' && dita === 0 && !scarico) note.push('Energia alta: a fine sessione la progressione può aumentare il carico.');
  return { p, note, dita, scarico };
}

/* ====== Dolore alle dita ====== */
function registraDita(v, fase) { S.dita.push({ t: Date.now(), v, fase }); }
function allarmeDita() {
  // dolore 2 o più in almeno due sessioni distinte degli ultimi 14 giorni
  const lim = Date.now() - 14 * 864e5;
  const giorni = new Set(S.dita.filter(d => d.t > lim && d.v >= 2).map(d => dayKey(d.t)));
  return giorni.size >= 2;
}

function proponiProgressione(p, ratings, ctx) {
  const v = ratings.filter(Boolean);
  if (!v.length || p.cat === 'riscaldamento' || p.id === 's-test' || !p.id || p.id === 'adhoc') return null;
  const tot = caricoTotale(p), med = p.id === 's-med' || (p.cat === 'forza' && !p.load && p.mm <= 15 && p.id !== 's-oa');
  if (v.includes('fallita')) {
    if (med) return { mm: Math.min(35, p.mm + 1), reps: p.reps, load: p.load, txt: `Tacca +1 mm (${p.mm + 1} mm): oggi una serie non è venuta.` };
    const nl = r05(tot * 0.95 - S.settings.bw);
    return { load: nl, reps: p.reps, mm: p.mm, txt: `Carico −5% (${fmtLoad(nl)}): oggi una serie non è venuta.` };
  }
  const facili = v.filter(x => x === 'facile').length, limite = v.includes('limite');
  const bloccata = (ctx.dita || 0) >= 1 || (ctx.ditaCheck || 0) >= 1 || ctx.energia === 'bassa' || ctx.ieri === 'tanto';
  if (limite || facili / v.length < 0.7) return { load: p.load, reps: p.reps, mm: p.mm, txt: 'Resta tutto uguale: il carico di oggi è quello giusto.' };
  if (bloccata) return { load: p.load, reps: p.reps, mm: p.mm, txt: 'Era facile, ma con dita o energia non al massimo meglio non aumentare. Resta tutto uguale.' };
  // limite: al massimo +5% di carico totale in 7 giorni
  const sett = S.history.filter(h => h.pid === p.id && Date.now() - new Date(h.date) < 7 * 864e5);
  const base7 = sett.length ? Math.min(...sett.map(h => (h.bw || S.settings.bw) + (+h.load || 0))) : tot;
  if (med) return { mm: Math.max(6, p.mm - 1), reps: p.reps, load: p.load, txt: `Tacca −1 mm (${p.mm - 1} mm): era tutto facile.` };
  if (p.cat === 'forza') {
    const passo = clamp(r05(tot * 0.02), 1, 2), nt = tot + passo;
    if (nt > base7 * 1.05 + 0.01) return { load: p.load, reps: p.reps, mm: p.mm, txt: 'Era facile, ma questa settimana hai già aumentato abbastanza. Resta tutto uguale.' };
    return { load: r05(nt - S.settings.bw), reps: p.reps, mm: p.mm, txt: `Carico +${fmtN(passo)} kg (${fmtLoad(r05(nt - S.settings.bw))}): era tutto facile.` };
  }
  const baseReps = (getP(p.id) || p).reps;
  if (p.reps < baseReps + 2) return { load: p.load, reps: p.reps + 1, mm: p.mm, txt: `Una ripetizione in più per serie (${p.reps + 1}): era tutto facile.` };
  const nt = Math.min(tot * 1.05, base7 * 1.05);
  if (nt <= tot + 0.25) return { load: p.load, reps: p.reps, mm: p.mm, txt: 'Era facile, ma questa settimana hai già aumentato abbastanza. Resta tutto uguale.' };
  return { load: r05(nt - S.settings.bw), reps: baseReps, mm: p.mm, txt: `Carico +5% (${fmtLoad(r05(nt - S.settings.bw))}) e ripetizioni di nuovo a ${baseReps}.` };
}

/* ====== Profilo di forza ====== */
const gruppoPresa = g => g === 'Semi-arcuata' ? 'Mezza arcuata' : g;
function profiloForza() {
  const righe = {};
  const add = (mm, grip, tot, bw, t, fonte) => {
    const k = mm + '|' + gruppoPresa(grip), r = tot / bw;
    const x = righe[k] || (righe[k] = { mm, presa: gruppoPresa(grip), punti: [] });
    x.punti.push({ t, r, tot, fonte });
  };
  const F = { facile: 1.08, giusta: 1.04, limite: 1.0 };
  for (const h of S.history) {
    if (h.cat !== 'forza' || h.oneArm || h.hang < 7 || h.pid === 'adhoc') continue;
    if (h.esito && h.esito.includes && h.esito.includes('fallita')) continue;
    const voti = (h.esito || []).filter(Boolean);
    const f = voti.length ? Math.min(...voti.map(x => F[x] || 1)) : 1;
    const f7 = h.hang < 10 ? 0.97 : 1;
    add(h.mm, h.grip, ((h.bw || S.settings.bw) + (+h.load || 0)) * f * f7, h.bw || S.settings.bw, new Date(h.date).getTime(), 'sessione');
  }
  if (S.max && S.max.total) add(S.max.mm || 20, S.max.grip || 'Semi-arcuata', S.max.total, S.max.bw || S.settings.bw, new Date(S.max.date).getTime(), 'test');
  const lista = Object.values(righe).map(x => {
    x.punti.sort((a, b) => a.t - b.t);
    x.best = Math.max(...x.punti.map(p => p.r));
    x.ultimo = x.punti[x.punti.length - 1].r;
    x.primo = x.punti[0].r;
    return x;
  }).sort((a, b) => a.mm - b.mm || a.presa.localeCompare(b.presa));
  let debole = null;
  if (lista.length >= 2) debole = lista.reduce((m, x) => (x.ultimo / refRapporto(x.mm)) < (m.ultimo / refRapporto(m.mm)) ? x : m);
  return { lista, debole };
}
/* per confrontare tacche diverse: una tacca più piccola rende di meno (stima grossolana, circa 2,5% per mm attorno ai 20 mm) */
const refRapporto = mm => 1 + (mm - 20) * 0.025;
function rapporto20() {
  const { lista } = profiloForza();
  const vicine = lista.filter(x => x.mm >= 15 && x.mm <= 25 && x.presa === 'Mezza arcuata');
  if (!vicine.length) return null;
  return Math.max(...vicine.map(x => x.ultimo / refRapporto(x.mm)));
}

/* ====== Tacca consigliata ====== */
function taccaConsigliata(p, ditaOggi = 0) {
  let mm = p.mm, motivo = '';
  const r = rapporto20();
  if (p.cat === 'riscaldamento') { mm = Math.max(25, p.mm); motivo = 'Per scaldarsi meglio una tacca ampia e comoda.'; }
  else if (p.id === 's-med') {
    mm = r == null ? 15 : r >= 1.6 ? 10 : r >= 1.35 ? 12 : r >= 1.15 ? 15 : 18;
    motivo = r == null ? 'Parti da 15 mm: la tacca giusta è la più piccola che tieni circa 12-13 s.' : `Con il tuo profilo (circa ${Math.round(r * 100)}% del peso a 20 mm) prova ${mm} mm: la più piccola che tieni circa 12-13 s.`;
  } else if (p.cat === 'forza') {
    if (r == null) { mm = 20; motivo = '20 mm è la misura di riferimento per le sospensioni massimali. Fai un test per una indicazione su misura.'; }
    else if (r >= 1.6) { mm = 15; motivo = `A 20 mm tieni già circa il ${Math.round(r * 100)}% del peso: una tacca più piccola sposta lo stimolo senza zavorre enormi.`; }
    else if (r < 1.05) { mm = 25; motivo = `A 20 mm tieni circa il ${Math.round(r * 100)}% del peso: una tacca più ampia permette carichi più puliti.`; }
    else { mm = 20; motivo = `Con circa il ${Math.round(r * 100)}% del peso a 20 mm, la tacca da 20 mm è adatta: si progredisce con il carico.`; }
  } else if (p.cat === 'potenza') { mm = 20; motivo = 'Per i repeaters una tacca da 20 mm è un buon compromesso tra intensità e volume.'; }
  else if (p.cat === 'resistenza') { mm = Math.max(20, p.mm); motivo = 'Per la resistenza conta il volume: meglio una tacca comoda, da 20 mm in su.'; }
  else { mm = p.mm; motivo = 'Protocollo personale: tieni la tacca che hai scelto.'; }
  if (ditaOggi >= 2) { mm = Math.max(mm + 5, 20); motivo += ' Con fastidio alle dita: 5 mm in più e presa aperta.'; }
  else if (ditaOggi === 1 && mm < 20) { mm = 20; motivo += ' Con un lieve fastidio, non scendere sotto i 20 mm.'; }
  return { mm, motivo, diversa: mm !== p.mm };
}

let AC = null;

}

function grafico(pts) {
  const W = 322, H = 110, vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs); if (hi - lo < 0.1) { lo -= 0.05; hi += 0.05; } const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const x = i => 6 + (i / (pts.length - 1)) * (W - 12), y = v => H - 10 - ((v - lo) / (hi - lo)) * (H - 26);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento della forza nel tempo" style="overflow:visible"><path d="${d} L${x(pts.length - 1).toFixed(1)},${H} L${x(0)},${H} Z" fill="var(--acc)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(pts[pts.length - 1].v).toFixed(1)}" r="5" fill="var(--bg)" stroke="var(--acc)" stroke-width="3"/><text x="${W}" y="${(y(pts[pts.length - 1].v) - 10).toFixed(1)}" text-anchor="end" class="gl">${Math.round(pts[pts.length - 1].v * 100)}%</text></svg>`;
}

/* ====== Sessione ====== */
let sess = null, tickId = null, lastT = 0;
const FASE_TXT = { prep: 'Preparati', hang: 'Appeso', rest: 'Pausa', setRest: 'Recupero' };

function passi(p) {
  const st = [{ k: 'prep', d: S.settings.prep }];
  for (let s = 0; s < p.sets; s++) {
    for (let r = 0; r < p.reps; r++) {
      if (p.oneArm) { st.push({ k: 'hang', d: p.hang, s, r, side: 'sinistro' }); st.push({ k: 'rest', d: Math.max(p.rest, 5), s, r }); st.push({ k: 'hang', d: p.hang, s, r, side: 'destro' }); }
      else st.push({ k: 'hang', d: p.hang, s, r });
      if (r < p.reps - 1 && p.rest > 0) st.push({ k: 'rest', d: p.rest, s, r });
    }
    if (s < p.sets - 1) st.push({ k: 'setRest', d: p.setRest, s });
  }
  return st;
}
function avvia(opt = {}) {
  if (sess) return;
  audioPronto();
  const ctx = { ...S.oggi };
  registraDita(ctx.dita, 'pre');
  let base = protocolloOggi();
  if (opt.test) base = protocolloTest(opt.test);
  sess = { base, ctx, test: opt.test || false, tut: 0, ratings: [], pill: null, note: [], t0: Date.now(), warmSec: 0 };
  if (S.settings.risc && base.cat !== 'riscaldamento') { sess.fase = 'warm'; sess.p = adatta(getP('s-warm'), ctx).p; }
  else iniziaMain();
  if (sess.fase === 'warm') avviaPassi();
  ui.view = 'sessione'; render(); schermoAcceso(true);
}
function iniziaMain() {
  const { p, note } = sess.test ? { p: { ...sess.base }, note: [] } : adatta(sess.base, sess.ctx);
  sess.fase = 'main'; sess.p = p; sess.note = note; sess.ratings = Array(p.sets).fill(null);
  avviaPassi();
}
function avviaPassi() {
  sess.steps = passi(sess.p); sess.i = 0; sess.elapsed = 0; sess.tot = sess.steps.reduce((s, x) => s + x.d, 0);
  entra(); sess.run = true; avviaTick();
}
function entra() {
  const st = sess.steps[sess.i];
  sess.rem = st.d; sess.lastSec = Math.ceil(st.d); sess.meta = false; sess.dieci = false;
  if (st.k === 'hang') { SUONO.via(); vibra(120); parla(st.side ? `Braccio ${st.side}, via` : 'Via'); }
  else if (st.k === 'rest') { SUONO.stop(); vibra([60, 40, 60]); if (st.d >= 10) parla(`Pausa, ${st.d} secondi`); }
  else if (st.k === 'setRest') {
    SUONO.stop(); vibra([60, 40, 60]);
    const ult = st.s === sess.p.sets - 2;
    parla(`Recupero, ${durVoce(st.d)}${ult ? '. Poi l’ultima serie' : ''}`);
    if (st.d >= 30) sess.pill = pillola();
  } else if (st.k === 'prep') parla(sess.fase === 'warm' ? 'Riscaldamento. Preparati' : 'Preparati');
  if (ui.view === 'sessione') { disegnaExtra(); paint(); }
}
function mmss(x) { x = Math.max(0, Math.round(x)); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); }
function durVoce(x) { x = Math.round(x); const m = Math.floor(x / 60), r = x % 60; const a = m ? (m === 1 ? 'un minuto' : m + ' minuti') : ''; const b = r ? r + ' secondi' : ''; return [a, b].filter(Boolean).join(' e '); }
function avviaTick() {
  fermaTick(); lastT = performance.now();
  tickId = setInterval(() => {
    const now = performance.now(), dt = (now - lastT) / 1000; lastT = now;
    if (!sess || !sess.run || !sess.steps) return;
    const st = sess.steps[sess.i];
    sess.rem -= dt; sess.elapsed += dt;
    const sec = Math.ceil(sess.rem);
    if (sec !== sess.lastSec) { sess.lastSec = sec; if (sec >= 1 && sec <= 3) SUONO.conta(sec); }
    if (st.k === 'hang' && st.d >= 10 && S.settings.meta && !sess.meta && sess.rem <= st.d / 2) { sess.meta = true; SUONO.meta(); }
    if (st.k === 'setRest' && !sess.dieci && sess.rem <= 10 && st.d >= 30) { sess.dieci = true; parla('Dieci secondi'); }
    if (sess.rem <= 0) {
      if (st.k === 'hang') sess.tut += st.d;
      sess.i++;
      if (sess.i >= sess.steps.length) return fineBlocco();
      entra();
    } else paint();
  }, 100);
}
function fermaTick() { if (tickId) clearInterval(tickId); tickId = null; }
function fineBlocco() {
  fermaTick(); sess.run = false;
  if (sess.fase === 'warm') {
    sess.warmSec = Math.round(sess.elapsed);
    if (sess.test) { SUONO.fine(); parla('Riscaldamento finito. Ora il test'); iniziaMain(); save(); render(); return; }
    sess.fase = 'check'; sess.chk = { pause: 'ok', dita: sess.ctx.dita, tempo: 'tutto' }; sess.pill = pillola();
    SUONO.fine(); parla('Riscaldamento finito. Tre domande veloci');
  } else {
    sess.fase = 'end'; sess.ditaPost = sess.ctx.dita; sess.applica = true; sess.pillEnd = pillola(); sess.msgEnd = pick(FINE_MSG);
    SUONO.fine(); parla('Sessione finita. Ben fatto'); schermoAcceso(false);
  }
  save(); render();
}
function paint() {
  if (!sess || !sess.steps) return;
  const st = sess.steps[sess.i], frac = clamp(sess.rem / st.d, 0, 1), C = 2 * Math.PI * 96;
  const set = (id, t) => { const e = $(id); if (e && e.textContent !== t) e.textContent = t; };
  set('#tDg', fmtClock(sess.rem));
  const ring = $('#ring'); if (ring) ring.style.strokeDashoffset = (C * (1 - frac)).toFixed(1);
  const f = $('#tfill'); if (f) f.style.width = (frac * 100).toFixed(1) + '%';
  const root = $('.tim'); if (root && root.dataset.k !== st.k) { root.dataset.k = st.k; set('#tPh', FASE_TXT[st.k]); }
  set('#tSd', st.side ? `Braccio ${st.side}` : '');
  const p = sess.p;
  set('#tPos', st.k === 'prep' ? `${p.sets} ${p.sets === 1 ? 'serie' : 'serie'} da ${p.reps} ${p.reps === 1 ? 'ripetizione' : 'ripetizioni'}` : `Serie ${st.s + 1} di ${p.sets}${p.reps > 1 ? ` · ripetizione ${Math.min(st.r + 1, p.reps)} di ${p.reps}` : ''}`);
  const nx = sess.steps[sess.i + 1];
  set('#tNx', nx ? `Poi: ${nx.k === 'hang' ? `sospensione ${nx.d} s${nx.side ? ' ' + nx.side : ''}` : nx.k === 'rest' ? `pausa ${nx.d} s` : `recupero ${fmtDur(nx.d)}`}` : 'Poi: fine');
  set('#tOv', `${mmss(sess.elapsed)} di ${mmss(sess.tot)}`);
  const pl = $('#tPlay'); if (pl) { const want = sess.run ? 'pause' : 'play'; if (pl.dataset.s !== want) { pl.dataset.s = want; pl.innerHTML = ic(want, 34); pl.setAttribute('aria-label', sess.run ? 'Pausa' : 'Riprendi'); } }
}
/* card sotto il timer: voto della serie appena finita e pillola, solo nei recuperi */
function disegnaExtra() {
  const el = $('#tExtra'); if (!el || !sess.steps) return;
  const st = sess.steps[sess.i];
  if (st.k === 'setRest' && sess.fase === 'main') {
    const v = sess.ratings[st.s];

function salvaSessione() {
  const p = sess.p, b = sess.base;
  const nt = $('#fNote'); sess.noteTxt = nt ? nt.value.trim() : '';
  if (sess.test) {
    const mm = parseInt(($('#tstM') || {}).value) || sess.tMm || p.mm, data = new Date().toISOString();
    if (sess.test === 'max') { const l = parseFloat(($('#tstL') || {}).value) || 0; S.max = { total: r05(S.settings.bw + l), mm, grip: p.grip, bw: S.settings.bw, date: data }; S.test = { tipo: 'max', valore: S.max.total, mm, data }; }
    else if (sess.test === 'med') S.test = { tipo: 'med', valore: sess.tMm ?? p.mm, mm: sess.tMm ?? p.mm, data };
    else S.test = { tipo: 'tenuta', valore: clamp(parseInt(($('#tstS') || {}).value) || Math.round(sess.tut) || 10, 1, 60), mm, data };
  }
  if (!sess.test || sess.tut > 0) S.history.push({ id: 'h-' + Date.now().toString(36), date: new Date().toISOString(), pid: b.id || 'adhoc', name: p.name, cat: p.cat, mm: p.mm, grip: p.grip, load: p.load, bw: S.settings.bw, hang: p.hang, rest: p.rest, reps: p.reps, sets: p.sets, setRest: p.setRest, oneArm: p.oneArm, tut: Math.round(sess.tut), dur: Math.round((Date.now() - sess.t0) / 1000), esito: sess.ratings, ditaPost: sess.ditaPost, energia: sess.ctx.energia, ieri: sess.ctx.ieri, adattamenti: sess.note, note: sess.noteTxt });
  registraDita(sess.ditaPost, 'post');
  const prop = sess.prop;
  if (b.piano && S.piano && S.piano.items[b.pianoIdx]) {
    const it = S.piano.items[b.pianoIdx]; it.fatto = true;
    if (prop && sess.applica && (prop.load !== p.load || prop.reps !== p.reps || prop.mm !== p.mm)) {
      S.piano.items.forEach((x, i) => { if (i > b.pianoIdx && x.k === it.k && !x.fatto) { x.p.load = r05(x.p.load + (prop.load - p.load)); if (prop.mm !== p.mm) x.p.mm = passoTacca(x.p.mm, prop.mm < p.mm ? -1 : 1); if (prop.reps !== p.reps) x.p.reps = Math.max(1, x.p.reps + (prop.reps - p.reps)); } });
    }
  } else if (prop && sess.applica && b.id && !sess.test && (prop.load !== p.load || prop.reps !== p.reps || prop.mm !== p.mm)) {
    // la progressione parte dai valori di base, non da quelli ridotti di oggi
    const orig = conProgressione(getP(b.id) || b);
    const g = { load: orig.load, reps: orig.reps, mm: orig.mm, txt: prop.txt, t: Date.now() };
    if (prop.load !== p.load) g.load = r05(orig.load + (prop.load - p.load));
    if (prop.reps !== p.reps) g.reps = prop.reps;
    if (prop.mm !== p.mm) g.mm = clamp(orig.mm + (prop.mm - p.mm), 4, 40);
    S.prog[b.id] = g;
  }
  if (S.scelta === 'tmp' && S.tmp && S.tmp.giorno !== dayKey()) { S.scelta = S.tmp.id || 's-maw'; S.tmp = null; }
  const daWizard = sess.test && ui.wiz;
  save(); chiudiSess();
  if (daWizard) { ui.wiz.proposta = generaPiano(); ui.wiz.step = 5; ui.view = 'piano'; render(); toast('Test salvato'); }
  else if (sess === null && S.test && b.id === 's-test' && S.piano && !itemPiano()) { S.piano = generaPiano(); save(); ui.view = 'piano'; render(); toast('Nuovo piano pronto'); }
  else toast('Sessione salvata');
}

/* ====== Scorri per iniziare ====== */
function iniziaSlide() {
  const sl = $('#slide'), th = $('#thumb'); if (!sl || !th) return;
  let drag = false, x0 = 0, dx = 0, moved = 0, max = 1;
  const setP = p => { th.style.transform = `translateX(${(p * max).toFixed(1)}px)`; sl.style.setProperty('--p', p.toFixed(3)); };
  th.addEventListener('pointerdown', e => { drag = true; moved = 0; dx = 0; x0 = e.clientX; max = sl.clientWidth - th.clientWidth - 12; try { th.setPointerCapture(e.pointerId); } catch (_) { } sl.classList.add('drag'); audioPronto(); });
  th.addEventListener('pointermove', e => { if (!drag) return; moved = Math.max(moved, Math.abs(e.clientX - x0)); dx = clamp(e.clientX - x0, 0, max); setP(dx / max); });
  th.addEventListener('pointerup', () => { if (!drag) return; drag = false; sl.classList.remove('drag'); const p = dx / max; if (p > 0.8) { setP(1); setTimeout(() => avvia(), 140); } else if (moved < 6) avvia(); else setP(0); });
  th.addEventListener('pointercancel', () => { drag = false; sl.classList.remove('drag'); setP(0); });
  sl.addEventListener('click', e => { if (!th.contains(e.target)) avvia(); });
  sl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); avvia(); } });
}

const ZAV_MAX = { no: 0, '10': 10, '20': 20, piu: 60 };

function tipoTest(a = S.attr) {
  if (!a) return 'tenuta';

  if (a.zavorra !== 'no' || a.scarico === 'si') return 'max';

}
const TEST_INFO = {
  tenuta: { nome: 'Test di tenuta', testo: 'Una sola sospensione a peso corporeo su una tacca ampia, fino a 30 secondi. Fermati appena senti che la presa cede: non serve arrivare al limite.' },
  max: { nome: 'Test massimale', testo: 'Quattro tentativi da 10 secondi su 20 mm, con 3 minuti di pausa. A ogni tentativo riuscito aggiungi un po’ di peso (o ne togli meno con la carrucola). Alla fine segni il carico più alto tenuto pulito.' },
  med: { nome: 'Test della tacca minima', testo: 'Quattro tentativi da 10 secondi a peso corporeo, con 3 minuti di pausa, scendendo di tacca quando riesci. Alla fine segni la tacca più piccola tenuta pulita per 10 secondi.' }

function protocolloTest(tipo) {
  const base = { id: 's-test', cat: 'forza', grip: 'Semi-arcuata', rest: 0, reps: 1, oneArm: false, hidden: true, desc: '', tip: '' };
  if (tipo === 'tenuta') return { ...base, name: 'Test di tenuta', grip: 'Aperta 4 dita', mm: snap(25), hang: 30, sets: 1, setRest: 60, load: 0 };

}

function generaPiano() {
  const a = S.attr, t = S.test, bw = S.settings.bw, conZav = a.zavorra !== 'no', zavMax = ZAV_MAX[a.zavorra] || 0, conScarico = a.scarico === 'si';

}

      ${cur ? `<div class="kick"><i style="background:var(--acc)"></i>Settimana ${cur.sett} di 4${cur.sett === 4 ? ' · scarico' : ''}</div><h2 class="serif h3">Prossima: ${esc(cur.p.name)}</h2>` : '<h2 class="serif h3">Blocco finito</h2><p class="sm2">Hai completato le 4 settimane. Rifai il test: l’app prepara il blocco successivo con i nuovi valori.</p>'}
      <div class="bar thick"><i style="width:${Math.round(fatti / pi.items.length * 100)}%"></i></div><div class="mut sm">${fatti} di ${pi.items.length} sessioni fatte</div>
      <div class="wk">${righe}</div>
      ${cur ? '<button class="btn pri" data-act="vai-oggi">Allenati ora</button>' : '<button class="btn pri" data-act="wz-test-diretto">Rifai il test</button>'}</section>
    <section class="glass card"><div class="t17">Il tuo profilo</div>
      <p class="sm2">${esc(TEST_INFO[S.test.tipo].nome)}: ${S.test.tipo === 'max' ? `${fmtN(S.test.valore)} kg in totale su ${S.test.mm} mm (${Math.round(S.test.valore / S.settings.bw * 100)}% del peso)` : S.test.tipo === 'med' ? `tacca minima ${S.test.mm} mm` : `${S.test.valore} s su ${S.test.mm} mm`}, ${new Date(S.test.data).toLocaleDateString('it-IT')}.</p>
      <p class="mut sm">Tacche: ${tacche().join(', ')} mm · zavorra: ${{ no: 'no', '10': 'fino a 10 kg', '20': 'fino a 20 kg', piu: 'oltre 20 kg' }[S.attr.zavorra]} · carrucola: ${S.attr.scarico === 'si' ? 'sì' : 'no'}</p>
      <div class="rowb"><button class="btn sec" data-act="wz-test-diretto">Rifai il test</button><button class="btn sec" data-act="wz-start">Cambia risposte</button></div></section>
    <section class="glass card"><div class="t17">Altre possibilità</div><p class="sm2">Se un giorno vuoi fare altro, puoi scegliere un protocollo standard o crearne uno tuo. Il piano ti aspetta.</p><button class="btn sec" data-act="nav" data-v="protocolli">Protocolli e personalizzati</button></section>
  </div>`;
}

</script>
